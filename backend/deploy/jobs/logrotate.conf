# Swiftline Portal — job log rotation
#
# Install as /etc/logrotate.d/swiftline-jobs.
#
# The two five-minute jobs write roughly 600 lines a day between them even when
# nothing is wrong, and these logs live on the same volume as the application.
# An EC2 root volume filling up takes the API down with it, so rotation is not
# housekeeping here — it is the thing that stops a quiet job from causing an
# outage months later.

/var/log/swiftline/*.log {
    daily
    rotate 30
    missingok
    notifempty
    compress
    delaycompress
    # The jobs append and reopen on each run rather than holding the file open,
    # so the log can be moved out from under them without a signal.
    copytruncate
    create 0640 ubuntu ubuntu
    su ubuntu ubuntu
}
