<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Swiftline Portal - Temporarily Unavailable</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      padding: 24px;
      background: #f5f6fa;
      color: #1f2937;
      font-family: Helvetica, "Helvetica Neue", "Nimbus Sans", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .card {
      width: 100%;
      max-width: 560px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 48px 40px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(13, 18, 130, 0.08);
    }

    .spinner {
      width: 44px;
      height: 44px;
      margin: 0 auto 24px;
      border: 4px solid rgba(13, 18, 130, 0.15);
      border-top-color: #0d1282;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0d1282;
      line-height: 1.3;
      margin-bottom: 16px;
    }

    p {
      font-size: 1rem;
      line-height: 1.6;
      color: #4b5563;
      margin-bottom: 12px;
    }

    .support {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #eef0f4;
      font-size: 0.875rem;
      color: #6b7280;
    }

    .status {
      margin-top: 24px;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #9ca3af;
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; }
    }

    @media (max-width: 480px) {
      .card { padding: 36px 24px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Swiftline Portal is temporarily unavailable</h1>
    <p>We&rsquo;re carrying out maintenance or deploying an update.<br />Please try again shortly.</p>
    <p class="support">For urgent assistance, contact Swiftline Support.</p>
    <p class="status">Service Unavailable</p>
  </main>
</body>
</html>
